name: Foundation
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rekky_ci
          POSTGRES_PASSWORD: rekky_ci
          POSTGRES_DB: rekky_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekky_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/rekky_backend
    env:
      DATABASE_URL: postgresql://rekky_ci:rekky_ci@127.0.0.1:5432/rekky_ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo run --locked -- migrate
      - run: cargo test --locked
      - run: cargo build --release --locked

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rekky_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/rekky_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --simulator --no-codesign
