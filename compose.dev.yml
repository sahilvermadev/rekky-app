services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rekky_local
      POSTGRES_USER: rekky_local
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - rekky_local_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekky_local -d rekky_local"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  rekky_local_pg:
